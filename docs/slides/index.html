<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3B情2 ネットワーク構築 — 概要スライド</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111820; color: #fff; font: 16px system-ui, sans-serif; height: 100vh; height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  main { min-height: 0; display: grid; place-items: center; }
  img { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
  nav { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; padding: 10px; background: #111820; }
  button, a { color: #fff; background: #253643; border: 1px solid #8295a3; border-radius: 6px; padding: 9px 14px; font: inherit; text-decoration: none; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 3px solid #65dae1; outline-offset: 3px; }
  #status { min-width: 5em; text-align: center; }
  #notice { margin: 0; }
  :fullscreen nav { position: fixed; bottom: 0; left: 0; right: 0; opacity: 0; transition: opacity .15s; }
  :fullscreen nav:hover, :fullscreen nav:focus-within { opacity: 1; }
  @media (max-width: 600px) { .help { display: none; } nav { gap: 6px; } button, a { padding: 8px; } }
</style>
<main aria-label="概要スライド"><img id="slide" alt=""></main>
<nav aria-label="スライド操作">
  <button id="prev" aria-label="前のスライド">← 前へ</button>
  <span id="status" role="status" aria-live="polite"></span>
  <button id="next" aria-label="次のスライド">次へ →</button>
  <button id="full">全画面</button>
  <a href="networking-lab-overview.pdf" download>PDF保存</a>
  <span class="help">← →：ページ送り / F：全画面 / Esc：終了</span>
  <p id="notice" role="alert"></p>
</nav>
<noscript>閲覧にはJavaScriptを有効にするか、PDF保存からPDFを開いてください。</noscript>
<script>
const slides = ["3B 情2 ネットワーク構築\n実験の概要\nインターネットとLAN を模擬したネットワークを構築する。\n模擬LAN のPC から模擬インターネットのWeb サーバーに接続する。\n通信が成立する理由を、設定と観察結果から説明する。\n1 / 11\n", "この実験でできるようになること\nネットワークを構築する\n機器の役割を理解し、IP アドレスと通信経路を設定する。\n動作を確かめる\n疎通・経路・名前解決・アドレス変換を観察する。\n結果から説明する\nルーティング、DNS、NAPT が連携する仕組みを説明する。\nE4PBL サイバーセキュリティで必要なネットワークの知識を学ぶ。\n2 / 11\n", "持ってくるもの\n持参するもの\n・実験ノート\n・スマホ\n・動画資料視聴のためのイヤフォン\n・マウス\n可能なら持参するもの\n・ノートPC\n・ノートPC を有線LAN に接続するためのアダプター\n3 / 11\n", "構築する機器と役割\n模擬LAN のPC から、GW を経由して模擬インターネットへ接続する。\n4 / 11\n模擬LANと模擬インターネットのネットワーク構成", "実験の進め方\n5 / 11\n前半は囲みの模擬LANを構築。後半はPCから模擬インターネットのWebサーバーへ接続。橙の矢印は通信の始点と終点を表し、実際はルーターとGWを経由する。", "通信には、行きと戻りの道順が必要\n6 / 11\nルーティングの説明。GWにはAのLANならR1、BのLANならR2へ転送する設定を登録する。", "DNS で、名前からIP アドレスを調べる\n7 / 11\nPCがweb.lab.exampleのIPを問い合わせ、DNSが192.168.0.80と回答する。その後PCがWebサーバーへ接続する。名前とIPは説明用の例。", "NAPT で、2 台のPC への応答を振り分ける\n8 / 11\nGWで送信元を変換し、AとBの通信をポート番号で区別する。応答時は記録した対応を参照して元のPCへ戻す。", "通信を確認して、ノートに残す\nping は、指定した相手から応答が返るかを確かめるコマンド。\n例：ClientA からR1（192.168.1.1）へ\nping -c 4 192.168.1.1（Linux で4 回送信。IP は説明用）\n実験ノートの記録例\n「ClientA からR1 へ4 回送信し、4 回応答した。損失0%。」\n分かったこと：ClientA とR1 の間で通信できた。\n9 / 11\n", "R1 には届くのに、Web には届かない\n例：ClientA からR1 へのping は成功。Web のIP へのping は失敗。\n次に確認すること\n調べたいこと\nR1 からGW のIP へping\nR1 とGW の間で通信できるか\nGW からWeb のIP へping\n模擬インターネット側に届くか\n経路の設定とGW のNAPT\nPC へ応答を戻せる設定か\nping の失敗だけでは原因は決まらない。区間ごとに確かめる。\nIP 指定で通信でき、名前指定だけ失敗するならDNS を確認する。\n10 / 11\n", "レポートで説明すること\n1．端末間の通信経路と、各ルーターの経路表の関係\n2．静的ルートがないときの、行きと戻りの通信\n3．複数端末の通信を区別するNAPT の仕組み\n4．内部DNS と外部DNS による名前解決の流れ\n構成図・IP アドレス表・コマンド結果を根拠に説明する。\n評価の観点：記録の正確さ、考察の論理性、技術の連携、問題解決。\n11 / 11\n"];
const image = document.getElementById('slide');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const full = document.getElementById('full');
let page = 0;
function show(index) {
  page = Math.max(0, Math.min(slides.length - 1, Number.isFinite(index) ? index : 0));
  image.src = `page-${String(page + 1).padStart(2, '0')}.png`;
  image.alt = slides[page];
  document.getElementById('status').textContent = `${page + 1} / ${slides.length}`;
  prev.disabled = page === 0;
  next.disabled = page === slides.length - 1;
  history.replaceState(null, '', `#${page + 1}`);
}
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
    full.blur();
    document.getElementById('notice').textContent = '';
  } catch {
    document.getElementById('notice').textContent = '全画面にできませんでした。PCではF11も利用できます。';
  }
}
prev.addEventListener('click', () => show(page - 1));
next.addEventListener('click', () => show(page + 1));
full.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => { full.textContent = document.fullscreenElement ? '全画面を終了' : '全画面'; });
document.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === ' ' && event.target.closest('button, a')) return;
  const actions = { ArrowRight: () => show(page + 1), PageDown: () => show(page + 1), ' ': () => show(page + 1), ArrowLeft: () => show(page - 1), PageUp: () => show(page - 1), Home: () => show(0), End: () => show(slides.length - 1), f: toggleFullscreen, F: toggleFullscreen, Escape: () => { if (document.fullscreenElement) toggleFullscreen(); } };
  if (actions[event.key]) { event.preventDefault(); actions[event.key](); }
});
window.addEventListener('hashchange', () => show(parseInt(location.hash.slice(1), 10) - 1));
image.addEventListener('error', () => { document.getElementById('notice').textContent = 'スライドを読み込めません。再読み込みするかPDF保存をご利用ください。'; });
show(parseInt(location.hash.slice(1), 10) - 1);
</script>
</html>
